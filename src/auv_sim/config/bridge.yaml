# ros_gz_bridge configuration: ROS 2 topic <-> Gazebo topic
# Actuator commands (ROS -> Gazebo)
- ros_topic_name: /auv/thrust            # [N], +ve = forward, limited to +/-60
  gz_topic_name: /model/auv/joint/propeller_joint/cmd_thrust
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /auv/rudder            # [rad], +ve = turn right (yaw decreases), +/-0.35
  gz_topic_name: /model/auv/joint/rudder_joint/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /auv/elevator          # [rad], -ve = nose down (dive), +/-0.35
  gz_topic_name: /model/auv/joint/elevator_joint/0/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

# Sensors & state (Gazebo -> ROS)
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /auv/odom              # ground truth, frame odom -> base_link
  gz_topic_name: /model/auv/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS

- ros_topic_name: /tf
  gz_topic_name: /model/auv/tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS

- ros_topic_name: /auv/joint_states
  gz_topic_name: /model/auv/joint_state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

- ros_topic_name: /auv/imu
  gz_topic_name: /auv/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS

- ros_topic_name: /auv/camera/image
  gz_topic_name: /auv/camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

- ros_topic_name: /auv/camera/camera_info
  gz_topic_name: /auv/camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
